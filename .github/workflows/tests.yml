name: tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Smoke-test Streamlit server startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > /tmp/fovra-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/fovra-streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/fovra-streamlit.log
          exit 1
      - run: python benchmark_cooling.py --output cooling-results
      - uses: actions/upload-artifact@v4
        with:
          name: cooling-python-${{ matrix.python-version }}
          path: cooling-results/

  minimum-streamlit-ui:
    name: UI on minimum supported Streamlit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt 'streamlit==1.49.0'
      - run: python -m pytest tests/test_cold_plate_view.py tests/test_cooling_view.py -q
