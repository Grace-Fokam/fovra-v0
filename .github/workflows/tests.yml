name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Smoke-test Streamlit server startup
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > /tmp/fovra-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/fovra-streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/fovra-streamlit.log
          exit 1
      - run: python benchmark_mpc.py --output benchmark-results --repeats 1
      - uses: actions/upload-artifact@v4
        with:
          name: mpc-comparison-python-${{ matrix.python-version }}
          path: benchmark-results/
      - run: python benchmark_adaptation.py --output adaptation-results
      - uses: actions/upload-artifact@v4
        with:
          name: adaptation-python-${{ matrix.python-version }}
          path: adaptation-results/
